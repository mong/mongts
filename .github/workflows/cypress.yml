name: Cypress

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Cypress testing
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_HOST: https://test-api.skde.org
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      # Migrate to pnpm, remove lines that are commented out when it works !
      # - name: Enable Corepack before setting up Node
      #   run: corepack enable

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
      - run: pnpm install --frozen-lockfile

      # - run: corepack enable && yarn install
      # - run: yarn workspace skde run build

      - name: Build skde
        run: pnpm --filter skde build  

      - name: Cypress run
        uses: cypress-io/github-action@v7.3.0
        with:
          working-directory: ./apps/skde
          build: pnpm export
          start: pnpm start-server
          browser: chrome
      - name: Archive production artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress videos
          path: apps/skde/cypress/videos
          retention-days: 1
