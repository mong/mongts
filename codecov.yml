codecov:
  require_ci_to_pass: yes

coverage:
  status:
    project:
      default:
        target: auto
        removed_code_behavior: adjust_base # Accounts for deleted lines automatically
        threshold: 5%
      skde:
        paths:
          - apps/skde
        threshold: 5%
    patch:
      default: off

comment: false

github_checks: false

ignore:
  - "apps/skde/public/"
